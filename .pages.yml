media:
  - name: img
    input: img
    output: /img
    extensions: [jpg, jpeg, png, webp, gif, svg]

content:
  - name: resume
    label: 履歷內容
    path: content.json
    type: file
    format: json
    fields:
      - name: site
        label: 網站基本設定
        type: object
        fields:
          - { name: title,       label: 瀏覽器標題,        type: string }
          - { name: description, label: 搜尋引擎說明,      type: text }
          - { name: brand_a,     label: 左上角文字（前）,  type: string }
          - { name: brand_b,     label: 左上角文字（後・橘色）, type: string }
          - { name: accent,      label: 主色（色碼）,      type: string }

      - name: hero
        label: 一、首屏
        type: object
        fields:
          - { name: portrait,     label: 圓形頭像（留空則不顯示）, type: image, options: { media: img } }
          - { name: eyebrow,      label: 最上方小字,        type: string }
          - { name: name_zh,      label: 中文名（大字）,    type: string }
          - { name: name_en,      label: 英文名,            type: string }
          - { name: tagline,      label: 一句話定位,        type: string }
          - { name: tagline_sub,  label: 定位下方那行數字,  type: text }
          - { name: bg_image,     label: 背景照片,          type: image, options: { media: img } }

      - name: about
        label: 二、個人簡介
        type: object
        fields:
          - { name: num,     label: 區塊編號（如 01 — ABOUT）, type: string }
          - { name: heading, label: 標題,                       type: string }
          - name: paragraphs
            label: 段落（每個一段）
            type: string
            list: true
          - name: tags
            label: 關鍵字標籤
            type: object
            list: true
            fields:
              - { name: text,      label: 文字,          type: string }
              - { name: highlight, label: 用橘色強調,    type: boolean }
          - { name: photo,         label: 右側照片,      type: image, options: { media: img } }
          - { name: photo_caption, label: 照片說明,      type: string }
          - name: stats
            label: 數據格（建議 4 個）
            type: object
            list: true
            fields:
              - { name: num,   label: 數字,                        type: string }
              - { name: label, label: 說明（可用 Enter 換行）,     type: text }

      - name: reel
        label: 三、代表作品（影片）
        type: object
        fields:
          - { name: num,     label: 區塊編號, type: string }
          - { name: heading, label: 標題,     type: string }
          - { name: intro,   label: 開頭說明一句話（可留空）, type: text }
          - name: items
            label: 每一支影片
            type: object
            list: true
            fields:
              - { name: url,         label: 影片連結（直接貼分享網址：TikTok／YouTube／Instagram 都可以）, type: string }
              - { name: platform,    label: 平台與頻道（如 TIKTOK ・ 元禾汽車）, type: string }
              - { name: title,       label: 影片標題, type: string }
              - { name: views,       label: 觀看數（如 24.4萬）, type: string }
              - { name: views_label, label: 觀看數後面的小字（預設「觀看」）, type: string }
              - { name: note,        label: 這支我做了什麼, type: text }
              - { name: link_text,   label: 連結文字（如 在 TikTok 上觀看 →）, type: string }
              - { name: embed,       label: 進階：自訂嵌入網址（一般留空，系統會自動從上面的連結轉換）, type: string }

      - name: skills
        label: 四、專業技能
        type: object
        fields:
          - { name: num,     label: 區塊編號, type: string }
          - { name: heading, label: 標題,     type: string }
          - name: items
            label: 技能項目
            type: object
            list: true
            fields:
              - { name: name, label: 中文名稱,       type: string }
              - { name: en,   label: 英文小標,       type: string }
              - { name: desc, label: 說明,           type: text }

      - name: experience
        label: 五、工作經歷
        type: object
        fields:
          - { name: num,     label: 區塊編號, type: string }
          - { name: heading, label: 標題,     type: string }
          - name: jobs
            label: 每一份工作
            type: object
            list: true
            fields:
              - { name: when,    label: 期間（如 2026.03 — 在職）, type: string }
              - { name: role,    label: 職稱,                      type: string }
              - { name: company, label: 公司／產業,                type: string }
              - name: blocks
                label: 內容段落
                type: object
                list: true
                fields:
                  - { name: title, label: 小標, type: string }
                  - { name: text,  label: 內文, type: text }
              - { name: credits_title, label: 清單的標題（如 代表作品）, type: string }
              - name: credits
                label: 清單（作品／成績）
                type: object
                list: true
                fields:
                  - { name: tag,  label: 左側標記（年份或數字）, type: string }
                  - { name: text, label: 內容,                   type: string }
                  - { name: note, label: 右側備註（可留空）,     type: string }
              - { name: result, label: 底部成果框（可留空）, type: string }

      - name: work
        label: 六、頻道成績
        type: object
        fields:
          - { name: num,     label: 區塊編號, type: string }
          - { name: heading, label: 標題,     type: string }
          - name: cards
            label: 頻道卡片
            type: object
            list: true
            fields:
              - { name: title,         label: 頻道名稱,                        type: string }
              - { name: meta,          label: 說明（可換行）,                  type: text }
              - { name: growth,        label: 成長數字（大字）,                type: string }
              - { name: best,          label: 最佳成績（可換行）,              type: text }
              - { name: image,         label: 封面圖／logo,                    type: image, options: { media: img } }
              - { name: image_is_logo, label: 這張是 logo（置中不裁切）,       type: boolean }
              - { name: link,          label: 連結網址,                        type: string }
              - { name: link_text,     label: 連結文字,                        type: string }

      - name: onset
        label: 七、拍攝現場
        type: object
        fields:
          - { name: num,     label: 區塊編號, type: string }
          - { name: heading, label: 標題,     type: string }
          - name: photos
            label: 照片（建議 6 張）
            type: image
            list: true
            options: { media: img }

      - name: contact
        label: 八、聯絡
        type: object
        fields:
          - { name: headline, label: 標語（可換行）, type: text }
          - { name: email,    label: Email,          type: string }
          - name: links
            label: 外部連結
            type: object
            list: true
            fields:
              - { name: text, label: 文字, type: string }
              - { name: url,  label: 網址, type: string }
          - { name: footer, label: 頁尾文字, type: string }
