<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蔡定軒 Tsai Ding Hsuan｜內容企劃・影像企劃</title>
<meta name="description" id="metadesc" content="短影音內容企劃。經營品牌形象。">
<meta property="og:title" content="蔡定軒 Tsai Ding Hsuan｜內容企劃・影像企劃">
<meta property="og:description" id="ogdesc" content="短影音內容企劃。經營品牌形象。">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;500;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;--bg-soft:#121212;--line:#242424;
  --ink:#f2f0ee;--ink-dim:#a5a09b;--ink-faint:#6b6660;
  --accent:#ff6f4d;--accent-soft:rgba(255,111,77,.14);--max:1120px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",-apple-system,"Segoe UI",sans-serif;font-weight:300;line-height:1.9;letter-spacing:.02em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:var(--max);margin:0 auto;padding:0 28px}
::selection{background:var(--accent);color:#0a0a0a}

nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,10,10,0);border-bottom:1px solid transparent;transition:background .4s,border-color .4s,backdrop-filter .4s}
nav.solid{background:rgba(10,10,10,.88);backdrop-filter:blur(14px);border-bottom-color:var(--line)}
nav .inner{max-width:var(--max);margin:0 auto;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{font-family:"Cormorant Garamond",serif;font-size:19px;letter-spacing:.18em;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand b{color:var(--accent);font-weight:400}
.navlinks{display:flex;gap:23px;list-style:none}
.navlinks a{color:var(--ink-dim);text-decoration:none;font-size:13px;letter-spacing:.1em;padding-bottom:3px;border-bottom:1px solid transparent;transition:color .25s,border-color .25s;white-space:nowrap}
.navlinks a:hover{color:var(--accent);border-bottom-color:var(--accent)}
.navtoggle{display:none;background:none;border:0;color:var(--ink);font-size:22px;cursor:pointer;line-height:1}

header.hero{position:relative;min-height:100svh;display:flex;align-items:center;overflow:hidden}
.hero-bg{position:absolute;inset:0;background-position:center 38%;background-size:cover;background-repeat:no-repeat;transform:scale(1.06);filter:grayscale(.35) contrast(1.05) brightness(.62)}
.hero-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 30% 45%,rgba(10,10,10,.25) 0%,rgba(10,10,10,.82) 62%,#0a0a0a 100%),linear-gradient(to bottom,rgba(10,10,10,.7) 0%,rgba(10,10,10,.15) 40%,rgba(10,10,10,.95) 100%)}
.hero-inner{position:relative;z-index:2;width:100%;max-width:var(--max);margin:0 auto;padding:0 28px}
.hero-portrait{
  width:clamp(94px,11vw,134px);aspect-ratio:1;border-radius:50%;overflow:hidden;
  margin-bottom:28px;border:1px solid rgba(255,111,77,.6);
  box-shadow:0 0 0 7px rgba(10,10,10,.5),0 16px 44px rgba(0,0,0,.65)
}
.hero-portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 24%;filter:grayscale(.12) contrast(1.04) brightness(1.02);display:block}
.eyebrow{font-size:11px;letter-spacing:.42em;color:var(--accent);margin-bottom:26px;text-transform:uppercase}
h1.name{font-family:"Noto Serif TC",serif;font-weight:500;font-size:clamp(3.2rem,10vw,7rem);line-height:1.02;letter-spacing:.06em;margin-bottom:8px}
.name-en{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:clamp(1.3rem,3.4vw,2.4rem);letter-spacing:.3em;color:var(--accent);margin-bottom:40px}
.tagline{font-family:"Noto Serif TC",serif;font-size:clamp(1.05rem,2.2vw,1.5rem);font-weight:300;letter-spacing:.14em;margin-bottom:14px}
.tagline-sub{font-size:14px;color:var(--ink-dim);letter-spacing:.06em}
.scrollcue{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);z-index:2;font-size:10px;letter-spacing:.3em;color:var(--ink-faint);text-align:center}
.scrollcue span{display:block;width:1px;height:44px;background:linear-gradient(var(--ink-faint),transparent);margin:12px auto 0}

section{padding:120px 0;position:relative}
section.alt{background:var(--bg-soft)}
.sec-head{margin-bottom:56px}
.sec-num{font-family:"Cormorant Garamond",serif;font-size:13px;letter-spacing:.3em;color:var(--accent);display:block;margin-bottom:14px}
h2{font-family:"Noto Serif TC",serif;font-weight:500;font-size:clamp(1.7rem,4vw,2.6rem);letter-spacing:.1em;line-height:1.35}
h2::after{content:"";display:block;width:46px;height:2px;background:var(--accent);margin-top:22px}
.rv{opacity:0;transform:translateY(26px);transition:opacity .85s cubic-bezier(.2,.7,.2,1),transform .85s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}

.about-grid{display:grid;grid-template-columns:1.35fr .95fr;gap:64px;align-items:start}
.about-body p{color:var(--ink-dim);margin-bottom:22px;font-size:15.5px}
.tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px}
.tag{font-size:12px;letter-spacing:.14em;padding:8px 18px;border:1px solid var(--line);border-radius:999px;color:var(--ink-dim)}
.tag.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.about-photo img{width:100%;display:block;filter:grayscale(.25) brightness(.88);border-radius:2px}
.about-photo figcaption{margin-top:14px;font-size:11px;letter-spacing:.16em;color:var(--ink-faint)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);margin-top:70px}
.stat{background:var(--bg);padding:34px 26px}
.stat .n{font-family:"Cormorant Garamond",serif;font-size:clamp(1.8rem,4vw,2.7rem);color:var(--accent);line-height:1}
.stat .l{font-size:11.5px;letter-spacing:.14em;color:var(--ink-faint);margin-top:12px;line-height:1.7;white-space:pre-line}

/* ===== 代表作品（純文字連結清單） ===== */
.reel-intro{color:var(--ink-dim);font-size:14.5px;margin:-20px 0 40px;max-width:660px}
.reels{border-top:1px solid var(--line)}
a.reel{display:grid;grid-template-columns:118px 1fr auto;gap:0 30px;align-items:baseline;
  padding:26px 10px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;
  transition:background .32s}
a.reel:hover{background:rgba(255,111,77,.055)}
.reel-views{font-family:"Cormorant Garamond",serif;font-size:26px;color:var(--accent);letter-spacing:.05em;line-height:1.15;white-space:nowrap}
.reel-views i{font-style:normal;font-family:"Noto Sans TC",sans-serif;font-size:10.5px;letter-spacing:.14em;color:var(--ink-faint);margin-left:7px}
.reel-plat{font-size:10.5px;letter-spacing:.2em;color:var(--ink-faint);margin-bottom:7px}
.reel-main h3{font-family:"Noto Serif TC",serif;font-size:17.5px;font-weight:500;letter-spacing:.05em;line-height:1.55;transition:color .25s}
a.reel:hover .reel-main h3{color:var(--accent)}
.reel-note{font-size:13px;color:var(--ink-dim);line-height:1.85;margin-top:11px;max-width:60ch}
.reel-go{font-size:11.5px;letter-spacing:.14em;color:var(--ink-faint);white-space:nowrap;transition:color .25s,transform .25s}
a.reel:hover .reel-go{color:var(--accent);transform:translateX(5px)}

.skills{border-top:1px solid var(--line)}
.skill{display:grid;grid-template-columns:230px 1fr;gap:40px;padding:30px 0;border-bottom:1px solid var(--line);align-items:baseline}
.skill h3{font-family:"Noto Serif TC",serif;font-size:17px;font-weight:500;letter-spacing:.1em}
.skill h3 em{display:block;font-family:"Cormorant Garamond",serif;font-style:normal;font-size:11px;letter-spacing:.24em;color:var(--accent);margin-top:6px}
.skill p{color:var(--ink-dim);font-size:14.5px}

.tl{position:relative;padding-left:34px}
.tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:var(--line)}
.job{position:relative;padding-bottom:62px}
.job:last-child{padding-bottom:0}
.job::before{content:"";position:absolute;left:-34px;top:8px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.job .when{font-family:"Cormorant Garamond",serif;font-size:14px;letter-spacing:.2em;color:var(--accent);margin-bottom:8px}
.job .role{font-family:"Noto Serif TC",serif;font-size:21px;font-weight:500;letter-spacing:.08em;margin-bottom:4px}
.job .co{font-size:13px;color:var(--ink-faint);letter-spacing:.1em;margin-bottom:24px}
.job .blk{margin-bottom:20px}
.job .blk h4{font-size:12.5px;letter-spacing:.2em;color:var(--accent);margin-bottom:8px;font-weight:500}
.job .blk p{color:var(--ink-dim);font-size:14.5px}
.credits{list-style:none;border-left:1px solid var(--line);padding-left:20px;margin-top:6px}
.credits li{font-size:14px;color:var(--ink-dim);padding:6px 0;display:flex;gap:14px;flex-wrap:wrap}
.credits li b{color:var(--accent);font-weight:400;font-family:"Cormorant Garamond",serif;letter-spacing:.1em;min-width:44px}
.credits li i{font-style:normal;color:var(--ink-faint);font-size:12.5px;letter-spacing:.08em}
.result{display:inline-block;margin-top:6px;padding:9px 20px;border:1px solid var(--accent);color:var(--accent);font-size:13px;letter-spacing:.1em;background:var(--accent-soft)}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.card{background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;transition:border-color .35s,transform .35s}
.card:hover{border-color:var(--accent);transform:translateY(-5px)}
.card .thumb{aspect-ratio:16/10;overflow:hidden;background:#000;position:relative}
.card .thumb img{width:100%;height:100%;object-fit:cover;filter:grayscale(.3) brightness(.8);transition:filter .5s,transform .6s}
.card:hover .thumb img{filter:none;transform:scale(1.05)}
.card .thumb.logo{background:radial-gradient(circle at 50% 45%,#1c1c1c 0%,#0b0b0b 70%);display:grid;place-items:center}
.card .thumb.logo img{width:auto;height:auto;max-width:64%;max-height:62%;object-fit:contain;filter:none;opacity:.9;transition:opacity .45s,transform .55s}
.card:hover .thumb.logo img{opacity:1;transform:scale(1.05)}
.card .body{padding:26px;display:flex;flex-direction:column;flex:1}
.card h3{font-family:"Noto Serif TC",serif;font-size:18px;font-weight:500;letter-spacing:.08em;margin-bottom:8px}
.card .meta{font-size:11.5px;letter-spacing:.12em;color:var(--ink-faint);margin-bottom:18px;line-height:1.8;white-space:pre-line}
.card .growth{font-family:"Cormorant Garamond",serif;font-size:26px;color:var(--accent);letter-spacing:.06em;margin-bottom:6px}
.card .best{font-size:12.5px;color:var(--ink-dim);margin-bottom:22px;line-height:1.75;white-space:pre-line}
.card .go{margin-top:auto;align-self:flex-start;text-decoration:none;font-size:12px;letter-spacing:.16em;color:var(--ink);border-bottom:1px solid var(--accent);padding-bottom:3px;transition:color .25s}
.card .go:hover{color:var(--accent)}

.gal{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.gal a{display:block;overflow:hidden;background:#000;aspect-ratio:1}
.gal a:nth-child(1),.gal a:nth-child(6){grid-column:span 2;aspect-ratio:16/10}
.gal img{width:100%;height:100%;object-fit:cover;filter:grayscale(.4) brightness(.72);transition:filter .5s,transform .7s}
.gal a:hover img{filter:none;transform:scale(1.07)}

.contact{text-align:center;padding:140px 0}
.contact .big{font-family:"Noto Serif TC",serif;font-size:clamp(1.5rem,4vw,2.4rem);font-weight:300;letter-spacing:.1em;margin-bottom:36px;line-height:1.6;white-space:pre-line}
.mail{display:inline-block;font-family:"Cormorant Garamond",serif;font-size:clamp(1.1rem,3vw,1.7rem);letter-spacing:.1em;color:var(--accent);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:8px;transition:border-color .3s}
.mail:hover{border-bottom-color:var(--accent)}
.social{margin-top:44px;display:flex;gap:26px;justify-content:center;flex-wrap:wrap}
.social a{font-size:12px;letter-spacing:.16em;color:var(--ink-faint);text-decoration:none;transition:color .25s}
.social a:hover{color:var(--accent)}
footer{border-top:1px solid var(--line);padding:30px 0;text-align:center}
footer p{font-size:11px;letter-spacing:.18em;color:var(--ink-faint)}

#loaderr{display:none;padding:100px 28px;text-align:center;color:var(--ink-dim)}
#loaderr code{color:var(--accent);font-size:13px}

@media (max-width:1040px){.navlinks{gap:17px}.navlinks a{font-size:12px;letter-spacing:.06em}}
@media (max-width:880px){
  .navlinks{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:0;background:rgba(10,10,10,.97);border-bottom:1px solid var(--line);padding:8px 0}
  .navlinks.open{display:flex}
  .navlinks a{display:block;padding:15px 28px;border:0;font-size:13px;letter-spacing:.1em}
  .navtoggle{display:block}
  section{padding:84px 0}
  a.reel{grid-template-columns:1fr;gap:0;padding:24px 4px}
  a.reel .reel-views{order:-1;font-size:23px;margin-bottom:9px}
  a.reel .reel-go{margin-top:16px}
  a.reel:hover .reel-go{transform:none}
  .about-grid{grid-template-columns:1fr;gap:40px}
  .about-photo{max-width:340px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .skill{grid-template-columns:1fr;gap:10px}
  .cards{grid-template-columns:1fr}
  .gal{grid-template-columns:repeat(2,1fr)}
  .gal a:nth-child(1),.gal a:nth-child(6){grid-column:span 2}
  .contact{padding:92px 0}
}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>

<nav id="nav">
  <div class="inner">
    <a href="#top" class="brand" id="brand"></a>
    <button class="navtoggle" id="navtoggle" aria-label="選單">☰</button>
    <ul class="navlinks" id="navlinks">
      <li><a href="#about">關於</a></li>
      <li><a href="#reel">代表作品</a></li>
      <li><a href="#skills">專業技能</a></li>
      <li><a href="#exp">工作經歷</a></li>
      <li><a href="#work">頻道成績</a></li>
      <li><a href="#set">拍攝現場</a></li>
      <li><a href="#contact">聯絡</a></li>
    </ul>
  </div>
</nav>

<div id="app"></div>

<div id="loaderr">
  <p>內容載入失敗。</p>
  <p style="margin-top:14px;font-size:13px">如果你是在本機直接雙擊開啟這個檔案，瀏覽器會禁止讀取 <code>content.json</code>。<br>請改看線上網址，或使用同資料夾裡的「<code>單檔版.html</code>」。</p>
</div>

<script>
/* ============ 讀 content.json 並渲染 ============ */
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };

function render(D){
  var s=D.site||{}, h=D.hero||{}, a=D.about||{}, r=D.reel||{}, k=D.skills||{},
      e=D.experience||{}, w=D.work||{}, o=D.onset||{}, c=D.contact||{};

  if(s.title){ document.title=s.title; }
  if(s.description){
    var md=document.getElementById('metadesc'), od=document.getElementById('ogdesc');
    if(md) md.setAttribute('content', s.description);
    if(od) od.setAttribute('content', s.description);
  }
  if(s.accent){ document.documentElement.style.setProperty('--accent', s.accent); }
  document.getElementById('brand').innerHTML = esc(s.brand_a||'')+' <b>'+esc(s.brand_b||'')+'</b>';

  var H='';

  /* HERO */
  H+='<header class="hero" id="top">'
   + '<div class="hero-bg" style="background-image:url(\''+esc(h.bg_image)+'\')"></div>'
   + '<div class="hero-inner">'
   +   (h.portrait ? '<div class="hero-portrait"><img src="'+esc(h.portrait)+'" alt="'+esc(h.name_zh)+'"></div>' : '')
   +   '<div class="eyebrow">'+esc(h.eyebrow)+'</div>'
   +   '<h1 class="name">'+esc(h.name_zh)+'</h1>'
   +   '<div class="name-en">'+esc(h.name_en)+'</div>'
   +   '<p class="tagline">'+esc(h.tagline)+'</p>'
   +   '<p class="tagline-sub">'+esc(h.tagline_sub)+'</p>'
   + '</div>'
   + '<div class="scrollcue">SCROLL<span></span></div>'
   + '</header>';

  /* ABOUT */
  H+='<section id="about"><div class="wrap">'
   + '<div class="sec-head rv"><span class="sec-num">'+esc(a.num)+'</span><h2>'+esc(a.heading)+'</h2></div>'
   + '<div class="about-grid"><div class="about-body rv">'
   + (a.paragraphs||[]).map(function(p){return '<p>'+esc(p)+'</p>';}).join('')
   + '<div class="tags">'+(a.tags||[]).map(function(t){return '<span class="tag'+(t.highlight?' on':'')+'">'+esc(t.text)+'</span>';}).join('')+'</div>'
   + '</div>'
   + '<figure class="about-photo rv"><img src="'+esc(a.photo)+'" alt="拍攝現場工作照"><figcaption>'+esc(a.photo_caption)+'</figcaption></figure>'
   + '</div>'
   + '<div class="stats rv">'+(a.stats||[]).map(function(t){return '<div class="stat"><div class="n">'+esc(t.num)+'</div><div class="l">'+esc(t.label)+'</div></div>';}).join('')+'</div>'
   + '</div></section>';

  /* 代表作品（整列都是連結，點了開新視窗） */
  if((r.items||[]).length){
    H+='<section id="reel" class="alt"><div class="wrap">'
     + '<div class="sec-head rv"><span class="sec-num">'+esc(r.num)+'</span><h2>'+esc(r.heading)+'</h2></div>'
     + (r.intro?'<p class="reel-intro rv">'+esc(r.intro)+'</p>':'')
     + '<div class="reels">'+r.items.map(function(v){
         return '<a class="reel rv" href="'+esc(v.url)+'" target="_blank" rel="noopener">'
          + '<div class="reel-views">'+esc(v.views)+'<i>'+esc(v.views_label||'觀看')+'</i></div>'
          + '<div class="reel-main">'
          +   '<div class="reel-plat">'+esc(v.platform)+'</div>'
          +   '<h3>'+esc(v.title)+'</h3>'
          +   (v.note?'<p class="reel-note">'+esc(v.note)+'</p>':'')
          + '</div>'
          + '<div class="reel-go">'+esc(v.link_text||'開啟 →')+'</div>'
          + '</a>';
       }).join('')+'</div>'
     + '</div></section>';
  }

  /* SKILLS */
  H+='<section id="skills"><div class="wrap">'
   + '<div class="sec-head rv"><span class="sec-num">'+esc(k.num)+'</span><h2>'+esc(k.heading)+'</h2></div>'
   + '<div class="skills">'+(k.items||[]).map(function(i){
       return '<div class="skill rv"><h3>'+esc(i.name)+'<em>'+esc(i.en)+'</em></h3><p>'+esc(i.desc)+'</p></div>';
     }).join('')+'</div>'
   + '</div></section>';

  /* EXPERIENCE */
  H+='<section id="exp" class="alt"><div class="wrap">'
   + '<div class="sec-head rv"><span class="sec-num">'+esc(e.num)+'</span><h2>'+esc(e.heading)+'</h2></div>'
   + '<div class="tl">'+(e.jobs||[]).map(function(j){
       var b='<article class="job rv">'
        + '<div class="when">'+esc(j.when)+'</div>'
        + '<div class="role">'+esc(j.role)+'</div>'
        + '<div class="co">'+esc(j.company)+'</div>';
       (j.blocks||[]).forEach(function(bl){ b+='<div class="blk"><h4>'+esc(bl.title)+'</h4><p>'+esc(bl.text)+'</p></div>'; });
       if((j.credits||[]).length){
         b+='<div class="blk"><h4>'+esc(j.credits_title||'代表作品')+'</h4><ul class="credits">'
          + j.credits.map(function(cr){
              return '<li><b>'+esc(cr.tag)+'</b>'+esc(cr.text)+(cr.note?'　<i>'+esc(cr.note)+'</i>':'')+'</li>';
            }).join('')
          + '</ul></div>';
       }
       if(j.result) b+='<div class="result">'+esc(j.result)+'</div>';
       return b+'</article>';
     }).join('')+'</div>'
   + '</div></section>';

  /* WORK（頻道成績） */
  H+='<section id="work"><div class="wrap">'
   + '<div class="sec-head rv"><span class="sec-num">'+esc(w.num)+'</span><h2>'+esc(w.heading)+'</h2></div>'
   + '<div class="cards">'+(w.cards||[]).map(function(cd){
       return '<article class="card rv">'
        + '<div class="thumb'+(cd.image_is_logo?' logo':'')+'"><img src="'+esc(cd.image)+'" alt="'+esc(cd.title)+'"></div>'
        + '<div class="body">'
        +   '<h3>'+esc(cd.title)+'</h3>'
        +   '<div class="meta">'+esc(cd.meta)+'</div>'
        +   '<div class="growth">'+esc(cd.growth)+'</div>'
        +   '<p class="best">'+esc(cd.best)+'</p>'
        +   (cd.link?'<a class="go" href="'+esc(cd.link)+'" target="_blank" rel="noopener">'+esc(cd.link_text||'前往 →')+'</a>':'')
        + '</div></article>';
     }).join('')+'</div>'
   + '</div></section>';

  /* ON SET */
  H+='<section id="set" class="alt"><div class="wrap">'
   + '<div class="sec-head rv"><span class="sec-num">'+esc(o.num)+'</span><h2>'+esc(o.heading)+'</h2></div>'
   + '<div class="gal rv">'+(o.photos||[]).map(function(p){
       return '<a href="'+esc(p)+'" target="_blank"><img src="'+esc(p)+'" alt="拍攝現場"></a>';
     }).join('')+'</div>'
   + '</div></section>';

  /* CONTACT */
  H+='<section id="contact"><div class="wrap contact">'
   + '<p class="big rv">'+esc(c.headline)+'</p>'
   + '<a class="mail rv" href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a>'
   + '<div class="social rv">'+(c.links||[]).map(function(l){
       return '<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.text)+'</a>';
     }).join('')+'</div>'
   + '</div></section>'
   + '<footer><div class="wrap"><p>'+esc(c.footer)+'</p></div></footer>';

  document.getElementById('app').innerHTML=H;
  boot();
}

function boot(){
  var nav=document.getElementById('nav');
  function onScroll(){ nav.classList.toggle('solid', window.scrollY>60); }
  onScroll(); window.addEventListener('scroll',onScroll,{passive:true});

  /* 進場／退場都有動畫：
     往下捲 → 元素進入畫面時浮現；
     往上捲 → 元素落到畫面下方時收回（已經看過、在上方的內容不會消失）。 */
  var io=new IntersectionObserver(function(es){
    es.forEach(function(x){
      if(x.isIntersecting){
        x.target.classList.add('in');
      }else if(x.boundingClientRect.top > 0){
        x.target.classList.remove('in');
      }
    });
  },{threshold:0,rootMargin:'0px 0px -12% 0px'});
  document.querySelectorAll('.rv').forEach(function(el){ io.observe(el); });

  var hb=document.querySelector('.hero-bg');
  if(hb && window.matchMedia('(prefers-reduced-motion: no-preference)').matches){
    window.addEventListener('scroll',function(){
      var y=window.scrollY;
      if(y<window.innerHeight) hb.style.transform='scale(1.06) translateY('+(y*0.16)+'px)';
    },{passive:true});
  }
}

var t=document.getElementById('navtoggle'), l=document.getElementById('navlinks');
t.addEventListener('click',function(){ l.classList.toggle('open'); });
l.addEventListener('click',function(ev){ if(ev.target.tagName==='A') l.classList.remove('open'); });

fetch('content.json?v='+Date.now())
  .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(function(err){
    console.error('content.json 載入失敗：',err);
    document.getElementById('loaderr').style.display='block';
  });
</script>
</body>
</html>
